spring:
  application:
    name: medivra
  datasource:
    url: ${LOCAL_DB_URL:jdbc:postgresql://localhost:5432/medivradb}
    username: ${LOCAL_DB_USERNAME:postgres}
    password: ${LOCAL_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 20000
      pool-name: MedivraHikariLocalPool
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 50
          order_inserts: true
          order_updates: true
          batch_versioned_data: true
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  mail:
    host: ${SPRING_MAIL_HOST:smtp-relay.brevo.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

server:
  port: 8080

razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}
  enabled: ${RAZORPAY_ENABLED:false}

ai:
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model-text: gemini-3.7-flash
    model-vision: gemini-3.7-flash
    model-fallback: gemini-3.5-flash-lite
    max-tokens: 4096
    temperature: 0.3
  groq:
    api-key: ${GROQ_API_KEY:}
    model-text: openai/gpt-oss-120b
    model-fallback: qwen/qwen3.8-27b
  openai:
    api-key: ${OPENAI_API_KEY:}
    model-text: gpt-4o-mini
    model-vision: gpt-4o-mini
  upload:
    max-file-size: 10MB

